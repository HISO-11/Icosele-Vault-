name: Build macOS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed \
            --name IcoseleVM \
            --add-data "assets:assets" \
            --add-data "data:data" \
            main.py

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r IcoseleVM-macOS.zip IcoseleVM.app || zip -r IcoseleVM-macOS.zip IcoseleVM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Icosele VM macOS
          path: dist/IcoseleVM-macOS.zip
