name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --name "IcoseleVault"
          --icon assets/icon512.png
          --add-data "assets;assets"
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import PySide6.QtWidgets
          --hidden-import PySide6.QtNetwork
          --hidden-import PySide6.QtOpenGL
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IcoseleVault-Windows
          path: dist/IcoseleVault.exe

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Windows Build ${{ steps.sha.outputs.short }}
          body: |
            Automated Windows build from commit ${{ github.sha }}.
            Download `IcoseleVault.exe` below.
          files: dist/IcoseleVault.exe
          draft: false
          prerelease: true
